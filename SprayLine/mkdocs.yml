site_name: Project of Spray Line Applications
site_description: This is a user guides and services developed by MISLab at NKUST 
site_author: horace.yang@gmail.com
nav:
  - Home: index.md
  - Issue Tracking:  SL-Issues.md
  - a1. Engineer User Interface: SL-Engineer-UI_1014_v1.md
  - a2. Manager User Interface: SL-Manager-UI_1015_v1.md
  - b. Web Service: SL-WS_1014_v1.md
  - c. Database: SL-DB_1014_v1.md
  - d. Knowledge Management: SL-KM_1015_v1.md
  - About: about.md
  - Contact: contact.md
theme: 
  name: material # mkdocs
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
        primary: indigo
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
  highlightjs: true
  hljs_languages:
    - yaml
    - rust
  navigation_depth: 2
plugins:
  - search
  - mkdocstrings